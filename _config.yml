title: Wonderstone Books
tagline: Jennifer Blackstone
description: Books by Jennifer Blackstone.
url: https://wonderstonebooks.com
author: Jennifer Blackstone

github_username: wonderstonebooks
cloudflare_analytics_token:

markdown: kramdown
kramdown:
  input: GFM

collections:
  books:
    output: true
    permalink: /books/:name/

defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/card.svg
  - scope:
      type: books
    values:
      layout: book

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - README.md
